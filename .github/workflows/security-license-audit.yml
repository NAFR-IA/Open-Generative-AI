name: Zero-cost security and license audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-license-audit.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate dependency security reports
        shell: bash
        run: |
          mkdir -p audit-reports
          npm audit --json > audit-reports/npm-audit-all.json || true
          npm audit --omit=dev --json > audit-reports/npm-audit-runtime.json || true

      - name: Generate dependency license inventory
        run: npx --yes license-checker --json --out audit-reports/licenses.json

      - name: Write human-readable summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync('audit-reports/npm-audit-all.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('audit-reports/npm-audit-runtime.json', 'utf8'));
          const licenses = JSON.parse(fs.readFileSync('audit-reports/licenses.json', 'utf8'));
          const lines = [
            '# Security and license audit',
            '',
            'Generated by GitHub Actions without paid services.',
            '',
            '## npm audit',
            '',
            '| Scope | Total | Low | Moderate | High | Critical |',
            '|---|---:|---:|---:|---:|---:|',
            row('All dependencies', all),
            row('Runtime dependencies', runtime),
            '',
            '## License inventory',
            '',
            'Packages inventoried: ' + Object.keys(licenses).length,
            '',
            'The complete machine-readable evidence is included in the JSON files.'
          ];
          function row(label, data) {
            const v = data.metadata?.vulnerabilities || {};
            return `| ${label} | ${v.total ?? 0} | ${v.low ?? 0} | ${v.moderate ?? 0} | ${v.high ?? 0} | ${v.critical ?? 0} |`;
          }
          fs.writeFileSync('audit-reports/README.md', lines.join('\n') + '\n');
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: NAFRI-OGA-Security-License-Audit
          path: audit-reports/
          if-no-files-found: error
          retention-days: 7
