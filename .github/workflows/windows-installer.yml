name: Build and test Windows packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "electron/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "electron/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-packages:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check modular code syntax
        run: |
          node --check electron/lib/nafriEngineRegistry.js
          node --check electron/lib/nafriProviderBridge.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check src/components/NafriStudio.js

      - name: Verify modular engine fallback and no-paid-provider policy
        run: node --test tests/nafriEngineRegistry.test.js

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build Windows installer and portable package
        run: npm run electron:build:win -- --publish never

      - name: Verify installer archive
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          & 7z t $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer archive integrity test failed" }

      - name: Verify packaged NAFRI Studio UI and preload bridge
        shell: pwsh
        run: |
          $app = Resolve-Path "release/win-unpacked/Open Generative AI.exe"
          $launched = Start-Process -FilePath $app -ArgumentList "--disable-gpu", "--no-sandbox", "--nafri-smoke-test" -PassThru
          try {
            if (-not $launched.WaitForExit(60000)) { throw "Studio UI smoke test timed out" }
            if ($launched.ExitCode -ne 0) { throw "Studio UI failed to load (exit code $($launched.ExitCode))" }
            "Packaged NAFRI Studio UI and secure preload passed smoke test."
          } finally {
            if (-not $launched.HasExited) { Stop-Process -Id $launched.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NAFRI-Open-Generative-AI-Windows-Installer
          path: release/*Setup*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload tested portable application
        uses: actions/upload-artifact@v4
        with:
          name: NAFRI-Open-Generative-AI-Windows-Portable-Tested
          path: release/win-unpacked/**
          if-no-files-found: error
          retention-days: 3
