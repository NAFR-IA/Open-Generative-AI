name: Build and test Windows packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-packages:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build Windows installer and portable package
        run: npm run electron:build:win -- --publish never

      - name: Verify installer archive
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          & 7z t $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer archive integrity test failed" }

      - name: Launch packaged application smoke test
        shell: pwsh
        run: |
          $app = Resolve-Path "release/win-unpacked/Open Generative AI.exe"
          $launched = Start-Process -FilePath $app -ArgumentList "--disable-gpu", "--no-sandbox" -PassThru
          Start-Sleep -Seconds 12
          if ($launched.HasExited) {
            if ($launched.ExitCode -ne 0) { throw "Application exited with code $($launched.ExitCode)" }
            throw "Application closed before the smoke-test window elapsed"
          }
          Stop-Process -Id $launched.Id -Force
          "Packaged application remained running for the 12-second smoke test."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NAFRI-Open-Generative-AI-Windows-Installer
          path: release/*Setup*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload tested portable application
        uses: actions/upload-artifact@v4
        with:
          name: NAFRI-Open-Generative-AI-Windows-Portable-Tested
          path: release/win-unpacked/**
          if-no-files-found: error
          retention-days: 3
