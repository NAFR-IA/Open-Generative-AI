name: OGA zero-cost cloud validation

on:
  pull_request:
    paths:
      - 'electron/lib/freeCloudProviders.js'
      - 'electron/main.js'
      - 'electron/preload.js'
      - 'src/components/FreeCloudModal.js'
      - 'src/components/Header.js'
      - 'tests/freeCloudProviders.test.js'
      - '.github/workflows/free-cloud-check.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax validation
        run: |
          node --check electron/lib/freeCloudProviders.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check tests/freeCloudProviders.test.js
      - name: Free cloud security and behaviour tests
        run: node --test tests/freeCloudProviders.test.js

  renderer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Build desktop renderer
        run: npm run vite:build
